[package]
name = "jjw"
version = "0.1.0"
edition = "2024"
description = "A local jj workspace manager with GitHub PR integration"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-width = "0.2.2"

[profile.release]
strip = "symbols"
lto = "thin"
